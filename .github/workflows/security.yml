name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Application dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
      - name: Audit locked Python dependencies
        run: |
          python -m pip install uv==0.13.6
          uv export --project api --frozen --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
          uv tool run pip-audit==2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: Audit locked Node dependencies
        run: npm --prefix web audit --package-lock-only

  secrets:
    name: Git secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history with redacted output
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact --no-banner

  images:
    name: Image audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        service: [api, web, db]
    env:
      SERVICE: ${{ matrix.service }}
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install checksum-verified scanner
        run: |
          curl --fail --location --retry 3 \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
            --output "$RUNNER_TEMP/trivy.tar.gz"
          echo "$TRIVY_SHA256  $RUNNER_TEMP/trivy.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP" trivy
      - name: Build with current OS security packages
        run: docker compose build --pull --no-cache "$SERVICE"
      - name: Save all advisories and block fixable High or Critical findings
        run: |
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln \
            --format json --output image-report.json "fitcher-${SERVICE}:latest"
          "$RUNNER_TEMP/trivy" image --image-src docker --scanners vuln \
            --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1 "fitcher-${SERVICE}:latest"
      - name: Preserve complete image report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit-${{ matrix.service }}
          path: image-report.json
          retention-days: 14
