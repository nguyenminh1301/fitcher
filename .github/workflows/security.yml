name: Security

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Application dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: apps/web/.nvmrc
      - name: Audit locked Python dependencies
        run: |
          python -m pip install uv==0.13.6
          uv export --project apps/api --frozen --no-emit-project --no-hashes --output-file "$RUNNER_TEMP/requirements.txt"
          uv tool run pip-audit==2.10.1 --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: Audit locked Node dependencies
        run: npm --prefix apps/web audit --package-lock-only

  secrets:
    name: Git secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Scan Git history with redacted output
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git . --log-opts=--all --redact --no-banner

  images:
    name: Image audit (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # release is the one-container image of the root Dockerfile; the others are the Compose services.
        service: [api, web, clickhouse, qdrant, release]
    env:
      SERVICE: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build repository images or pull pinned third-party images
        run: |
          if [ "$SERVICE" = release ]; then
            docker build --pull --no-cache --tag fitcher-release:scan .
            echo "IMAGE=fitcher-release:scan" >> "$GITHUB_ENV"
            exit 0
          fi
          cp .env.example .env
          image="$(docker compose config --format json | jq -r --arg s "$SERVICE" '.services[$s].image // empty')"
          if [ -z "$image" ]; then
            docker compose build --pull --no-cache "$SERVICE"
            image="fitcher-${SERVICE}:latest"
          else
            docker compose pull "$SERVICE"
          fi
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Save all advisories and block fixable High or Critical findings
        # Exceptions apply only to this image and expire; see SECURITY.md, Image exceptions.
        run: bash scripts/scan_image.sh "$IMAGE" ".github/trivy/${SERVICE}.trivyignore.yaml"
      - name: Preserve complete image report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-audit-${{ matrix.service }}
          path: image-report.json
          retention-days: 14
