name: Demo

# Builds the web app as a demo: every feature on the hand-written sample data, no api behind it, every
# page marked with the Sample data badge (apps/web/lib/api/sources.ts). Pull requests that touch the web
# app build it; main and a manual run publish it as ghcr.io/<owner>/fitcher-demo, which starts with
# `docker run -p 127.0.0.1:3000:3000 ghcr.io/<owner>/fitcher-demo`. The release image contains no sample
# pack; the repository's development packs stay.

on:
  pull_request:
    paths: ["apps/web/**", ".github/workflows/demo.yml"]
  push:
    branches: [main]
    paths: ["apps/web/**", ".github/workflows/demo.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo:
    name: Build the sample-data demo
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/web
          file: apps/web/Dockerfile
          build-args: NEXT_PUBLIC_FITCHER_DEMO=1
          pull: true
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ github.repository }}-demo:latest
          labels: org.opencontainers.image.description=fitcher demo on sample data, no backend
