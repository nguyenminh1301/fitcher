name: Bug report
description: Report a reproducible application or tooling failure.
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Remove credentials, personal data and private datasets from all examples. Use SECURITY.md for vulnerability reports.
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Include the command, route or minimal example that demonstrates the failure.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Commit, operating system, browser, Python/Node versions and dev or Docker mode as relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
