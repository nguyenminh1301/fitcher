# Hand-written eval set of the iowa_liquor pack (Phase 11): every DECISIONS §12 category, over 2025.
reference_date: "2026-01-15"
cases:
  - id: "top_categories_q2_vs_q1"
    question: "Top 5 liquor categories by sales dollars in Q2 2025 compared with Q1 2025"
    language: "en"
    category: "two_period_compare"
    role: "analyst"
    expected:
      intent: "data_query"
      outcome: "answer"
      metrics: ["total_sales_dollars"]
      periods:
        - label: "Q1 2025"
          start: "2025-01-01"
          end: "2025-04-01"
        - label: "Q2 2025"
          start: "2025-04-01"
          end: "2025-07-01"
      dataset: "liquor_sales"
      top_n: 5
      rank_by: "total_sales_dollars"
      columns: ["category_name"]
    expected_sql: |-
      SELECT category_name,
          sumIf(sale_dollars, sale_date >= toDate('2025-04-01') AND sale_date < toDate('2025-07-01')) AS sales_q2,
          sumIf(sale_dollars, sale_date >= toDate('2025-01-01') AND sale_date < toDate('2025-04-01')) AS sales_q1
      FROM marts.liquor_sales
      WHERE sale_date >= toDate('2025-01-01') AND sale_date < toDate('2025-07-01')
      GROUP BY category_name
      ORDER BY sales_q2 DESC
      LIMIT 5
    status: "approved"
    evidence:
      - kind: "manual"
        ref: "packs/iowa_liquor/README.md"
    confidence: 1.0

