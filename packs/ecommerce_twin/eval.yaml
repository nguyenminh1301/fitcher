# Labelled questions covering every required category (DECISIONS §12), at
# least three per category. previous_question is asked first in the same
# conversation for a follow_up case. active_from_phase marks cases whose branch a later
# phase builds; they are reported as not yet scored until then.
# expected.columns lists the columns retrieval must find; the time column is
# not listed because the agent takes it from the dataset definition.
# reference_date is "today" for every case, inside the data's 2022-2026 range.
reference_date: "2026-01-15"
cases:
  - id: top_products_q1_2024_vs_q1_2025
    question: Top 10 sản phẩm bán chạy nhất quý 1 năm 2024 so với quý 1 năm 2025
    language: vi
    category: two_period_compare
    role: analyst
    expected:
      intent: data_query
      outcome: answer
      metrics: [net_sales]
      periods:
        - {label: Q1 2024, start: "2024-01-01", end: "2024-04-01"}
        - {label: Q1 2025, start: "2025-01-01", end: "2025-04-01"}
      top_n: 10
      rank_by: net_sales
      dataset: sales_lines
      columns: [product_id]
    expected_sql: |-
      SELECT
          product_id,
          sumIf(line_amount, order_date >= toDate('2025-01-01') AND order_date < toDate('2025-04-01')) AS net_sales_q1_2025,
          sumIf(line_amount, order_date >= toDate('2024-01-01') AND order_date < toDate('2024-04-01')) AS net_sales_q1_2024
      FROM marts.sales_lines
      WHERE order_status != 'cancelled'
        AND order_date >= toDate('2024-01-01')
        AND order_date < toDate('2025-04-01')
      GROUP BY product_id
      ORDER BY net_sales_q1_2025 DESC, product_id
      LIMIT 10
    status: approved
    evidence: &owner [{kind: manual, ref: docs/DECISIONS.md#1-goals-and-scope}]
    confidence: 1.0

