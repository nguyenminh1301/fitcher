        - {label: Q1 2024, start: "2024-01-01", end: "2024-04-01"}
      top_n: 10
      rank_by: net_sales
      dataset: sales_lines
      columns: [product_id]
    expected_sql: |-
      SELECT
          product_id,
          sumIf(line_amount, order_date >= toDate('2024-01-01') AND order_date < toDate('2024-04-01')) AS net_sales_q1_2024,
          sumIf(line_amount, order_date >= toDate('2023-01-01') AND order_date < toDate('2023-04-01')) AS net_sales_q1_2023
      FROM marts.sales_lines
      WHERE order_status != 'cancelled'
        AND order_date >= toDate('2023-01-01')
        AND order_date < toDate('2024-04-01')
      GROUP BY product_id
      ORDER BY net_sales_q1_2024 DESC, product_id
      LIMIT 10
