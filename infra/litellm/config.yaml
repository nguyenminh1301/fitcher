# Model aliases called by the engine. Model names come from the environment,
# so changing a model needs only an .env change and a litellm restart.
model_list:
  - model_name: fast
    litellm_params:
      model: os.environ/LITELLM_MODEL_FAST
      api_key: os.environ/OPENAI_API_KEY
  - model_name: sql-gen
    litellm_params:
      model: os.environ/LITELLM_MODEL_SQL_GEN
      api_key: os.environ/OPENAI_API_KEY
  - model_name: sql-gen-hard
    litellm_params:
      model: os.environ/LITELLM_MODEL_SQL_GEN_HARD
      api_key: os.environ/OPENAI_API_KEY
  - model_name: embed
    litellm_params:
      model: os.environ/LITELLM_MODEL_EMBED
      api_key: os.environ/OPENAI_API_KEY

# A model that rejects a request parameter, such as a fixed temperature,
# receives the request without it instead of failing.
litellm_settings:
  drop_params: true
  # One agent_logs.llm_calls row per call (callbacks/clickhouse_logger.py,
  # mounted next to this file).
  callbacks: clickhouse_logger.proxy_handler_instance

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
