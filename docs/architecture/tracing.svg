<text x="1130.0" y="132" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Workspace console</text>
<text x="1130.0" y="153" font-size="13.5" fill="#6B6B70" text-anchor="middle">Runs, Audit, Costs,</text>
