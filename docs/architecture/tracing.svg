<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="316" viewBox="-30 -30 1340 316" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
<title>5. Every run is traced</title>
<rect x="-30" y="-30" width="1340" height="316" fill="#ffffff"/>
<defs>
<marker id="head0" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e1e1e"/></marker>
</defs>
<text x="0" y="28" font-size="26" font-weight="700" fill="#1e1e1e">5. Every run is traced</text>
<polyline points="300,125 490,125" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head0)"/>
<polyline points="790,125 980,125" fill="none" stroke="#1e1e1e" stroke-width="2" marker-end="url(#head0)"/>
<rect x="0" y="60" width="300" height="130" rx="14" fill="#fff9db" stroke="#e67700" stroke-width="2"/>
<svg x="134.0" y="74" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e67700" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-3A8 8 0 1 1 21 12z"/></svg>
<text x="150.0" y="128" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle">Each question</text>
<text x="150.0" y="150" font-size="13.5" fill="#5c636a" text-anchor="middle">Gets one trace id that</text>
<text x="150.0" y="168" font-size="13.5" fill="#5c636a" text-anchor="middle">follows it through every step</text>
<rect x="490" y="60" width="300" height="130" rx="14" fill="#e6fcf5" stroke="#0c8599" stroke-width="2"/>
<svg x="624.0" y="74" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0c8599" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
<text x="640.0" y="128" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle">Run log</text>
<text x="640.0" y="150" font-size="13.5" fill="#5c636a" text-anchor="middle">Steps, SQL, AI calls, cost</text>
<text x="640.0" y="168" font-size="13.5" fill="#5c636a" text-anchor="middle">and access decisions</text>
<rect x="980" y="60" width="300" height="130" rx="14" fill="#e7f5ff" stroke="#1c7ed6" stroke-width="2"/>
<svg x="1114.0" y="74" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#1c7ed6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M9 9v12"/></svg>
<text x="1130.0" y="128" font-size="17" font-weight="700" fill="#1e1e1e" text-anchor="middle">Workspace console</text>
<text x="1130.0" y="150" font-size="13.5" fill="#5c636a" text-anchor="middle">Runs, Audit, Costs,</text>
<text x="1130.0" y="168" font-size="13.5" fill="#5c636a" text-anchor="middle">Feedback and Evaluation</text>
<text x="395" y="113" font-size="13" fill="#5c636a" text-anchor="middle">written as it runs</text>
<text x="885" y="113" font-size="13" fill="#5c636a" text-anchor="middle">read by admins and reviewers</text>
<text x="0" y="230" font-size="15" fill="#5c636a">Run logs and conversations are kept for 90 days.</text>
</svg>
