<svg x="358.0" y="79" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/></svg>
<text x="370.0" y="132" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Blocked</text>
<text x="370.0" y="153" font-size="13.5" fill="#6B6B70" text-anchor="middle">Unsafe input</text>
<text x="370.0" y="171" font-size="13.5" fill="#6B6B70" text-anchor="middle">stops here</text>
<rect x="540" y="60" width="200" height="120" rx="14" fill="#F6F6F7" stroke="#C9C9CE" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="621.0" y="72" width="38" height="38" rx="10" fill="#E8E8EA"/>
<svg x="628.0" y="79" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-3A8 8 0 1 1 21 12z"/></svg>
<text x="640.0" y="132" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Quick reply</text>
<text x="640.0" y="153" font-size="13.5" fill="#6B6B70" text-anchor="middle">Definitions, chart changes</text>
<text x="640.0" y="171" font-size="13.5" fill="#6B6B70" text-anchor="middle">or off-topic questions</text>
<rect x="1080" y="60" width="200" height="120" rx="14" fill="#F6F6F7" stroke="#C9C9CE" stroke-width="1.5" stroke-dasharray="6 5"/>
<rect x="1161.0" y="72" width="38" height="38" rx="10" fill="#E8E8EA"/>
<svg x="1168.0" y="79" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>
<text x="1180.0" y="132" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Clarify or deny</text>
<text x="1180.0" y="153" font-size="13.5" fill="#6B6B70" text-anchor="middle">Ask which one was meant,</text>
<text x="1180.0" y="171" font-size="13.5" fill="#6B6B70" text-anchor="middle">or refuse politely</text>
<rect x="0" y="250" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="81.0" y="262" width="38" height="38" rx="10" fill="#111111"/>
<svg x="88.0" y="269" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-8 8H4l2.5-3A8 8 0 1 1 21 12z"/></svg>
<text x="100.0" y="322" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Question</text>
<text x="100.0" y="343" font-size="13.5" fill="#6B6B70" text-anchor="middle">Typed in the chat</text>
<text x="100.0" y="361" font-size="13.5" fill="#6B6B70" text-anchor="middle">or on the command line</text>
<rect x="270" y="250" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="351.0" y="262" width="38" height="38" rx="10" fill="#111111"/>
<svg x="358.0" y="269" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>
<text x="370.0" y="322" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Safety check</text>
<text x="370.0" y="343" font-size="13.5" fill="#6B6B70" text-anchor="middle">Screens for prompt</text>
<text x="370.0" y="361" font-size="13.5" fill="#6B6B70" text-anchor="middle">injection first</text>
<rect x="540" y="250" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="621.0" y="262" width="38" height="38" rx="10" fill="#111111"/>
<svg x="628.0" y="269" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/></svg>
<text x="640.0" y="322" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Understand</text>
<text x="640.0" y="343" font-size="13.5" fill="#6B6B70" text-anchor="middle">What is measured,</text>
<text x="640.0" y="361" font-size="13.5" fill="#6B6B70" text-anchor="middle">for which period</text>
<rect x="810" y="250" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="891.0" y="262" width="38" height="38" rx="10" fill="#111111"/>
<svg x="898.0" y="269" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19V5a2 2 0 0 1 2-2h14v16H6a2 2 0 0 0-2 2z"/><path d="M4 19a2 2 0 0 0 2 2h14"/></svg>
<text x="910.0" y="322" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Match terms</text>
<text x="910.0" y="343" font-size="13.5" fill="#6B6B70" text-anchor="middle">Maps words to the</text>
<text x="910.0" y="361" font-size="13.5" fill="#6B6B70" text-anchor="middle">company&#x27;s metrics</text>
<rect x="1080" y="250" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="1161.0" y="262" width="38" height="38" rx="10" fill="#111111"/>
<svg x="1168.0" y="269" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
<text x="1180.0" y="322" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Permission check</text>
<text x="1180.0" y="343" font-size="13.5" fill="#6B6B70" text-anchor="middle">Is the question clear,</text>
<text x="1180.0" y="361" font-size="13.5" fill="#6B6B70" text-anchor="middle">and may this role see it?</text>
<rect x="1080" y="470" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="1161.0" y="482" width="38" height="38" rx="10" fill="#111111"/>
<svg x="1168.0" y="489" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16"/></svg>
<text x="1180.0" y="542" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Write SQL</text>
<text x="1180.0" y="563" font-size="13.5" fill="#6B6B70" text-anchor="middle">One read-only query</text>
<rect x="810" y="470" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="891.0" y="482" width="38" height="38" rx="10" fill="#111111"/>
<svg x="898.0" y="489" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4l13 8-13 8z"/></svg>
<text x="910.0" y="542" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Check and run</text>
<text x="910.0" y="563" font-size="13.5" fill="#6B6B70" text-anchor="middle">Validated, then run</text>
<text x="910.0" y="581" font-size="13.5" fill="#6B6B70" text-anchor="middle">as the user&#x27;s role</text>
<rect x="540" y="470" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="621.0" y="482" width="38" height="38" rx="10" fill="#111111"/>
<svg x="628.0" y="489" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17V5"/></svg>
<text x="640.0" y="542" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Pick a chart</text>
<text x="640.0" y="563" font-size="13.5" fill="#6B6B70" text-anchor="middle">Chosen by rules</text>
<text x="640.0" y="581" font-size="13.5" fill="#6B6B70" text-anchor="middle">from the result shape</text>
<rect x="270" y="470" width="200" height="120" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="351.0" y="482" width="38" height="38" rx="10" fill="#111111"/>
<svg x="358.0" y="489" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
<text x="370.0" y="542" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Summarize</text>
<text x="370.0" y="563" font-size="13.5" fill="#6B6B70" text-anchor="middle">Explains the rows in</text>
<text x="370.0" y="581" font-size="13.5" fill="#6B6B70" text-anchor="middle">the question&#x27;s language</text>
<rect x="0" y="470" width="200" height="120" rx="14" fill="#111111" stroke="#111111" stroke-width="1.5"/>
<rect x="81.0" y="482" width="38" height="38" rx="10" fill="#FFFFFF"/>
<svg x="88.0" y="489" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#111111" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12l3 3 5-6"/></svg>
<text x="100.0" y="542" font-size="16.5" font-weight="600" fill="#FFFFFF" text-anchor="middle">Answer</text>
<text x="100.0" y="563" font-size="13.5" fill="#C9C9CE" text-anchor="middle">SQL, table, chart</text>
<text x="100.0" y="581" font-size="13.5" fill="#C9C9CE" text-anchor="middle">and summary</text>
<text x="1085" y="652" font-size="13" fill="#6B6B70" text-anchor="middle">on an error: fix and retry, up to 3 times</text>
<text x="0" y="695" font-size="15" fill="#6B6B70">The answer streams to the screen step by step. Numbers always come from the database, never from the AI model.</text>
</svg>
