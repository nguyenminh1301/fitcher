<text x="530.0" y="332" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Role-aware search</text>
<text x="530.0" y="353" font-size="13.5" fill="#6B6B70" text-anchor="middle">Layer 1: context</text>
<text x="530.0" y="371" font-size="13.5" fill="#6B6B70" text-anchor="middle">limited to the role</text>
<rect x="657" y="260" width="184" height="130" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="730.0" y="272" width="38" height="38" rx="10" fill="#111111"/>
<svg x="737.0" y="279" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>
<text x="749.0" y="332" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Permission check</text>
<text x="749.0" y="353" font-size="13.5" fill="#6B6B70" text-anchor="middle">Layer 2: refuses</text>
<text x="749.0" y="371" font-size="13.5" fill="#6B6B70" text-anchor="middle">before any SQL</text>
<rect x="876" y="260" width="184" height="130" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="949.0" y="272" width="38" height="38" rx="10" fill="#111111"/>
<svg x="956.0" y="279" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
<text x="968.0" y="332" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Database rules</text>
<text x="968.0" y="353" font-size="13.5" fill="#6B6B70" text-anchor="middle">Layer 3: the real</text>
<text x="968.0" y="371" font-size="13.5" fill="#6B6B70" text-anchor="middle">security boundary</text>
<rect x="1095" y="260" width="184" height="130" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="1168.0" y="272" width="38" height="38" rx="10" fill="#111111"/>
<svg x="1175.0" y="279" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/></svg>
<text x="1187.0" y="332" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Data</text>
<text x="1187.0" y="353" font-size="13.5" fill="#6B6B70" text-anchor="middle">Only what the</text>
<text x="1187.0" y="371" font-size="13.5" fill="#6B6B70" text-anchor="middle">role may read</text>
<rect x="657" y="460" width="403" height="125" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="839.5" y="472" width="38" height="38" rx="10" fill="#111111"/>
<svg x="846.5" y="479" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
<text x="858.5" y="532" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Audit log</text>
<text x="858.5" y="553" font-size="13.5" fill="#6B6B70" text-anchor="middle">Every allow and deny is recorded</text>
<text x="858.5" y="571" font-size="13.5" fill="#6B6B70" text-anchor="middle">and shown to admins</text>
<text x="0" y="485" font-size="15" fill="#6B6B70">Layer 1 only keeps the AI&#x27;s context small and relevant.</text>
<text x="0" y="506" font-size="15" fill="#6B6B70">Layer 3, the database&#x27;s own grants and row</text>
<text x="0" y="527" font-size="15" fill="#6B6B70">filters, is what actually enforces access.</text>
