<text x="858.5" y="132" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Access rules</text>
<text x="858.5" y="153" font-size="13.5" fill="#6B6B70" text-anchor="middle">One policy file per company sets each role&#x27;s</text>
<text x="858.5" y="171" font-size="13.5" fill="#6B6B70" text-anchor="middle">tables, columns and rows</text>
<rect x="0" y="260" width="184" height="130" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="73.0" y="272" width="38" height="38" rx="10" fill="#111111"/>
