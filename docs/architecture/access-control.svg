<text x="92.0" y="332" font-size="16.5" font-weight="600" fill="#111111" text-anchor="middle">Signed-in user</text>
<text x="92.0" y="353" font-size="13.5" fill="#6B6B70" text-anchor="middle">Asks with one</text>
<text x="92.0" y="371" font-size="13.5" fill="#6B6B70" text-anchor="middle">of their roles</text>
<rect x="219" y="260" width="184" height="130" rx="14" fill="#FFFFFF" stroke="#E8E8EA" stroke-width="1.5"/>
<rect x="292.0" y="272" width="38" height="38" rx="10" fill="#111111"/>
