[project]
name = "fitcher-api"
version = "0.1.0"
description = "Domain-neutral natural-language data analysis API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]
jobs = [
    "clickhouse-connect==1.11.0",
    "dbt-clickhouse==1.10.3",
    "dbt-core==1.12.6",
    "huggingface-hub==2.4.0",
    "pyarrow==26.0.0",
]

[tool.uv]
default-groups = ["dev", "jobs"]

[tool.pytest.ini_options]
testpaths = ["tests", "../../jobs/tests"]
pythonpath = [".", "../.."]
