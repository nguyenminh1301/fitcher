version: 2

# Raw tables published by jobs/load_data.py from jobs/sources/ecommerce_twin.yaml.
# Raw columns are Nullable; staging applies assumeNotNull, so keys and dates are
# tested here before a NULL could be hidden as a default value.
sources:
  - name: ecommerce_twin
    schema: raw
    tables:
      - name: customers
        columns:
          - {name: customer_id, data_tests: [not_null]}
          - {name: signup_date, data_tests: [not_null]}
      - name: products
        columns:
          - {name: product_id, data_tests: [not_null]}
      - name: sessions
        columns:
          - {name: session_id, data_tests: [not_null]}
          - {name: customer_id, data_tests: [not_null]}
          - {name: session_start, data_tests: [not_null]}
      - name: orders
        columns:
          - {name: order_id, data_tests: [not_null]}
          - {name: customer_id, data_tests: [not_null]}
          - {name: order_date, data_tests: [not_null]}
          - {name: status, data_tests: [not_null]}
      - name: order_items
        columns:
          - {name: order_item_id, data_tests: [not_null]}
          - {name: order_id, data_tests: [not_null]}
          - {name: product_id, data_tests: [not_null]}
          - {name: quantity, data_tests: [not_null]}
          - {name: unit_price, data_tests: [not_null]}
      - name: returns
        columns:
          - {name: return_id, data_tests: [not_null]}
          - {name: order_item_id, data_tests: [not_null]}
          - {name: return_date, data_tests: [not_null]}
      - name: support_tickets
        columns:
          - {name: ticket_id, data_tests: [not_null]}
          - {name: created_date, data_tests: [not_null]}
