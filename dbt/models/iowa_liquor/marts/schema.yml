version: 2

# The mart of the iowa_liquor pack (packs/iowa_liquor): Iowa Liquor Sales 2025.
models:
  - name: liquor_sales
    description: >-
      One row per invoice line of a Class E liquor licensee's purchase from the
      State of Iowa in 2025: the store, its city and county, the item with its
      category and vendor, the state's bottle cost and retail price, bottles,
      dollars and liters sold, and the state's margin on the line.
    columns:
      - {name: invoice_id, data_tests: [not_null]}
      - {name: sale_date, data_tests: [not_null]}
      - {name: store_number, data_tests: [not_null]}
      - {name: store_name}
      - {name: store_city}
      - {name: store_zip_code}
      - {name: county_name}
      - {name: category_name}
      - {name: vendor_name}
      - {name: item_number}
      - {name: item_description}
      - {name: bottles_per_case}
      - {name: bottle_volume_ml}
      - {name: state_bottle_cost}
      - {name: state_bottle_retail}
      - {name: bottles_sold, data_tests: [not_null]}
      - {name: sale_dollars, data_tests: [not_null]}
      - {name: liters_sold}
      - {name: state_margin}
