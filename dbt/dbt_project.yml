name: fitcher
version: "1.0.0"
config-version: 2
profile: fitcher

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
macro-paths: ["macros"]

flags:
  send_anonymous_usage_stats: false

# One folder per dbt_tag under models/. Each folder carries its tag, so
# `dbt build --select +tag:<dbt_tag>` rebuilds that tag's staging views and
# marts only. Staging views live in raw; agent-facing marts in marts.
#
# A non-Hugging Face source reaches its staging through the source_tables
# variable (macros/source_table.sql). In live mode its marts are views over
# the live src_<source> tables that run with the privileges of their definer,
# the dbt user: an agent role is granted the mart and never src_* or raw
# (DECISIONS §4 Data sources).
models:
  fitcher:
    ecommerce_twin:
      +tags: ["ecommerce_twin"]
      staging:
        +schema: raw
        +materialized: view
      marts:
        +schema: marts
        +materialized: table
    iowa_liquor:
      +tags: ["iowa_liquor"]
      staging:
        +schema: raw
        +materialized: view
      marts:
        +schema: marts
        +materialized: "{{ 'view' if var('source_mode', 'copy') == 'live' else 'table' }}"
    fixture_widgets:
      +tags: ["fixture_widgets"]
      staging:
        +schema: raw
        +materialized: view
      marts:
        +schema: marts
        +materialized: "{{ 'view' if var('source_mode', 'copy') == 'live' else 'table' }}"
        +sql_security: definer
        +definer: CURRENT_USER
