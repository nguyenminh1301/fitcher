# Connection settings come from the environment of the jobs Compose service.
fitcher:
  target: lab
  outputs:
    lab:
      type: clickhouse
      driver: http
      host: "{{ env_var('CLICKHOUSE_HOST', 'clickhouse') }}"
      port: "{{ env_var('CLICKHOUSE_HTTP_PORT', '8123') | int }}"
      user: "{{ env_var('CLICKHOUSE_ADMIN_USER') }}"
      password: "{{ env_var('CLICKHOUSE_ADMIN_PASSWORD') }}"
      schema: marts
      threads: 4
