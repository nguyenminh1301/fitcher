[project]
name = "fitcher-api"
version = "0.1.0"
description = "Natural-language data analysis API"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.0",
    "openai==3.41.0",
    "python-dotenv==1.2.4",
    "uvicorn==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", ".."]
